<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>原型 vs 小程序 UI对比</title>
<style>
body { background: #1a1a2e; color: #eee; font-family: sans-serif; padding: 20px; }
h1 { text-align: center; }
.compare { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
.card { background: #252540; padding: 16px; border-radius: 12px; }
.card h2 { margin: 0 0 12px; font-size: 16px; }
img { width: 375px; border-radius: 8px; }
</style>
</head>
<body>
<h1>原型 vs 小程序 UI对比</h1>
<div class="compare">
  <div class="card"><h2>原型 - 今日页面</h2><img src="proto-today.png"></div>
  <div class="card"><h2>小程序 - 当前页面</h2><img src="miniprogram-current.png"></div>
</div>
<div class="compare">
  <div class="card"><h2>原型 - 历史页面</h2><img src="proto-history.png"></div>
</div>
</body>
</html>
